apiVersion: 1

datasources:
  - name: Neon Postgres
    uid: neon-postgres
    type: postgres
    access: proxy
    url: ${PGHOST}:${PGPORT}
    database: ${PGDATABASE}
    user: ${PGUSER}
    isDefault: true
    editable: true
    jsonData:
      sslmode: ${PGSSLMODE}
      postgresVersion: 1800
      timescaledb: false
    secureJsonData:
      password: ${PGPASSWORD}

global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: investment-platform-backend
    metrics_path: /metrics
    static_configs:
      - targets: ["backend:8000"]

  - job_name: bff
    metrics_path: /metrics
    static_configs:
      - targets: ["bff:8080"]

  - job_name: mcp
    metrics_path: /metrics
    static_configs:
      - targets: ["mcp:8090"]
